[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-journey-insights"
version = "1.0.0"
description = "A reproducible customer journey and repeat-purchase analysis pipeline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
journey-insights = "customer_journey_insights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
